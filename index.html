<!-- CHOIX (QUESTION + REDIRECTION) -->
<section id="choix" class="pb-14 md:pb-20">
  <div class="rounded-3xl bg-gradient-to-br from-white/7 to-white/3 hairline p-6 md:p-8">
    <div class="grid md:grid-cols-12 gap-6 items-center">
      <div class="md:col-span-7">
        <h2 class="font-display text-2xl md:text-3xl text-white tracking-tight">
          Êtes-vous une université ou une école ?
        </h2>
        <p class="mt-3 text-slate-300">
          Choisissez votre type d’établissement pour lancer la simulation adaptée.
        </p>
      </div>

      <div class="md:col-span-5">
        <div class="grid gap-3">
          <!-- UNIVERSITE -->
          <button
            type="button"
            data-go="https://uni.kolilink.com"
            class="go-btn focus-ring group rounded-3xl bg-white text-[#0B1220] p-5 hover:bg-white/95 transition flex items-center justify-between"
          >
            <div>
              <div class="text-xs text-slate-500 font-semibold tracking-wide uppercase">Université</div>
              <div class="mt-1 text-lg font-semibold">Lancer la simulation</div>
            </div>
            <div class="w-10 h-10 rounded-2xl bg-[#3b82f6]/10 flex items-center justify-center">
              <svg class="w-5 h-5 text-[#3b82f6] group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 7l5 5m0 0l-5 5m5-5H6"/>
              </svg>
            </div>
          </button>

          <!-- ECOLE -->
          <button
            type="button"
            data-go="https://simulation.kolilink.com"
            class="go-btn focus-ring group rounded-3xl bg-white/6 hairline p-5 hover:bg-white/8 transition flex items-center justify-between"
          >
            <div>
              <div class="text-xs text-slate-400 font-semibold tracking-wide uppercase">Primaire / Collège</div>
              <div class="mt-1 text-lg font-semibold text-white">Lancer la simulation</div>
            </div>
            <div class="w-10 h-10 rounded-2xl bg-[#3b82f6]/15 hairline flex items-center justify-center">
              <svg class="w-5 h-5 text-[#93c5fd] group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 7l5 5m0 0l-5 5m5-5H6"/>
              </svg>
            </div>
          </button>

          <div class="text-xs text-slate-400 mt-1">
            Vous ne savez pas ? Choisissez la simulation la plus proche de votre réalité.
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  // Redirection au clic (simple, fiable, sans dépendances)
  document.querySelectorAll(".go-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const url = btn.getAttribute("data-go");
      if (url) window.location.href = url;
    });
  });
</script>
