<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kolilink — Choisissez votre établissement</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 32px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      background: #fff;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 20px;
      text-align: left;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-cta {
      color: var(--primary);
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Quel type d’établissement êtes-vous ?</h1>
    <p>Choisissez votre catégorie pour lancer la simulation adaptée.</p>

    <div class="cards">
      <a href="https://uni.kolilink.com" class="card">
        <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f" alt="Université">
        <div class="card-content">
          <div class="card-title">Université</div>
          <div class="card-cta">Lancer la simulation →</div>
        </div>
      </a>

      <a href="https://simulation.kolilink.com" class="card">
        <img src="https://images.unsplash.com/photo-1588072432836-e10032774350" alt="École">
        <div class="card-content">
          <div class="card-title">Primaire & Collège</div>
          <div class="card-cta">Lancer la simulation →</div>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
